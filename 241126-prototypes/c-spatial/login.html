<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · VATP Spatial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-direction="c-spatial" data-screen="login">
  <div class="stage"><svg class="map" id="map" viewBox="-360 -150 760 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="cursor:default"></svg></div>
  <form class="glass login-card" action="dashboard.html">
    <div style="display:flex;align-items:center;gap:10px;font-weight:800"><span class="logo" style="width:30px;height:30px;border-radius:10px;background:conic-gradient(from 210deg,var(--teal),var(--blue),var(--lime),var(--teal))"></span>VATP</div>
    <h1>Step into the campus.</h1>
    <p class="muted" style="margin:0">Four buildings, 218 devices, one live map.</p>
    <a class="btn primary block" href="dashboard.html" style="margin-top:22px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 11v3M8.5 7.5a5 5 0 0 1 8.5 3.5c0 3-1 5.5-2.5 7.5M7 11a5 5 0 0 0 .3 1.7M7 16c.8 1.6 1.8 3 3 4M12 7a4 4 0 0 0-4 4"/></svg>
      Sign in with a passkey
    </a>
    <p class="faint" style="font-size:12px;text-align:center;margin:8px 0 0">Touch ID, Face ID, Windows Hello or a security key</p>
    <div class="or">or</div>
    <label class="field"><span>Email</span><input type="email" placeholder="name@vatp.lv" autocomplete="username" /></label>
    <label class="field"><span>Password</span><input type="password" placeholder="••••••••" autocomplete="current-password" /></label>
    <button class="btn block" type="submit">Sign in</button>
    <a class="btn block" href="dashboard.html" style="margin-top:8px">Continue with Google</a>
    <p class="faint" style="font-size:12px;margin:16px 0 0">Prototype: any input works.</p>
  </form>
  <div class="login-foot">LIVE · 6.4 °C Ventspils · 129 kW · COP 4.1</div>
  <script src="../shared/mock-data.js?v=20261124"></script>
  <script src="../shared/svg-charts.js"></script>
  <script src="app.js"></script>
  <script>Spatial.backdrop();</script>
  <script src="../shared/switcher.js"></script>
</body>
</html>
